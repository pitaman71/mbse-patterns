[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mbse-patterns"
version = "0.7.0"
description = "Constraints, queries and patterns over mbse-schemas data: constraints as constraints, validated and queried, and (later) populations to generate and characterize"
keywords = ["constraints", "queries", "patterns", "validation", "mbse", "sysml", "interface", "test data"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mbse-schemas>=0.7.1,<0.8", "mbse-expressions>=0.4.3,<0.5"]

[project.optional-dependencies]
yaml = ["mbse-schemas[yaml]>=0.7.1,<0.8"]

[tool.setuptools.package-data]
"mbse.Patterns" = ["skill/*.md", "skill/references/*.md"]

[tool.setuptools.packages.find]
include = ["mbse*"]
namespaces = true

[dependency-groups]
dev = [
    "coverage[toml]>=7.10",
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "nbmake>=1.5.5",
    "pytest>=9.1.1",
    "pyyaml>=6",
]

[tool.uv.sources]
mbse-schemas = { path = "../../mbse-schemas/python3", editable = true }  # the sibling checkouts: scripts/siblings.py
mbse-expressions = { path = "../../mbse-expressions/python3", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests", "tutorials"]
addopts = "--nbmake"

[tool.coverage.run]
source = ["mbse.Patterns"]
omit = ["*/mbse/Patterns/Conformance/*"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
